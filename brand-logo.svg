<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="9M2PJU Morse Code Lab Official Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141816"/>
      <stop offset="100%" stop-color="#0a0d0c"/>
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d4944"/>
      <stop offset="50%" stop-color="#232a27"/>
      <stop offset="100%" stop-color="#161b19"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fe0d1"/>
      <stop offset="100%" stop-color="#27c5b3"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5cc76"/>
      <stop offset="100%" stop-color="#d4a84f"/>
    </linearGradient>
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Chassis -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="url(#bezelGrad)" stroke-width="4"/>
  <rect x="12" y="12" width="96" height="96" rx="20" fill="none" stroke="rgba(39, 197, 179, 0.15)" stroke-width="1.5"/>

  <!-- Morse Pulses at Top Header ( - · - ) -->
  <rect x="26" y="24" width="20" height="6" rx="3" fill="url(#tealGrad)" filter="url(#glowTeal)"/>
  <circle cx="60" cy="27" r="4" fill="url(#goldGrad)" filter="url(#glowGold)"/>
  <rect x="74" y="24" width="20" height="6" rx="3" fill="url(#tealGrad)" filter="url(#glowTeal)"/>

  <!-- Base Plate & Pivot Post -->
  <rect x="22" y="78" width="76" height="10" rx="5" fill="#1d2421" stroke="#35403a" stroke-width="2"/>
  <circle cx="36" cy="83" r="3" fill="#d4a84f"/>
  <circle cx="84" cy="83" r="3" fill="#d4a84f"/>
  
  <!-- Pivot Bearing Post -->
  <rect x="54" y="58" width="12" height="22" rx="3" fill="#2a332f" stroke="#485850" stroke-width="2"/>
  <circle cx="60" cy="65" r="3.5" fill="url(#goldGrad)"/>

  <!-- Key Lever Arm (Tilted down in action) -->
  <path d="M30 68 L60 64 L86 52" stroke="#4a5a52" stroke-width="6" stroke-linecap="round"/>
  <path d="M30 68 L60 64 L86 52" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Key Knob / Finger Piece -->
  <ellipse cx="88" cy="50" rx="9" ry="6" fill="#181f1c" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <ellipse cx="88" cy="49" rx="5" ry="3" fill="url(#goldGrad)"/>

  <!-- Contact Gap & Spark Glow -->
  <circle cx="34" cy="74" r="3" fill="url(#goldGrad)" filter="url(#glowGold)"/>
  <path d="M34 68 L34 74" stroke="#f5cc76" stroke-width="2"/>

  <!-- CW RF Sine Waveform Emission -->
  <path d="M22 46 Q 32 36, 42 46 T 62 46 T 82 46 T 98 46" fill="none" stroke="url(#tealGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glowTeal)" opacity="0.85"/>
</svg>
